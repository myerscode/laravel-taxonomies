name: Update Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to regenerate changelog for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  changelog:
    uses: myerscode/workflows/.github/workflows/php-changelog.yml@v1
    with:
      version: ${{ github.event.inputs.version }}
    secrets:
      PAT: ${{ secrets.PAT }}
