name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version (e.g. 1.2.3)'
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    uses: myerscode/workflows/.github/workflows/php-release.yml@v1
    with:
      version: ${{ github.event.inputs.version }}
      scheme: semver
    secrets:
      PAT: ${{ secrets.PAT }}
